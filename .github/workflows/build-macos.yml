name: macOS build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "macos_app/**"
      - ".github/workflows/build-macos.yml"
  push:
    branches: [main]
    tags: ["macos-v*"]
    paths:
      - "macos_app/**"
      - ".github/workflows/build-macos.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    defaults:
      run:
        working-directory: macos_app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Read package version
        id: version
        env:
          RELEASE_REF: ${{ github.ref }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^version: \([^+]*\).*/\1/p' pubspec.yaml)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if [[ "$RELEASE_REF" == refs/tags/* && "$RELEASE_TAG" != "macos-v$version" ]]; then
            echo "태그와 pubspec.yaml 버전이 일치하지 않습니다."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build macOS app
        run: flutter build macos --release

      - name: Create DMG
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p build/dmg
          cp -R "build/macos/Build/Products/Release/CYViewer.app" build/dmg/
          ln -s /Applications build/dmg/Applications
          hdiutil create -volname "CY뷰어" -srcfolder build/dmg -ov -format UDZO "build/CYViewer-macOS-v${PACKAGE_VERSION}.dmg"
          cd build
          shasum -a 256 "CYViewer-macOS-v${PACKAGE_VERSION}.dmg" > "SHA256SUMS-macOS-v${PACKAGE_VERSION}.txt"

      - name: Upload macOS package
        uses: actions/upload-artifact@v4
        with:
          name: CYViewer-macOS-v${{ steps.version.outputs.version }}
          path: |
            macos_app/build/CYViewer-macOS-v${{ steps.version.outputs.version }}.dmg
            macos_app/build/SHA256SUMS-macOS-v${{ steps.version.outputs.version }}.txt
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/macos-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download macOS package
        uses: actions/download-artifact@v4
        with:
          name: CYViewer-macOS-v${{ needs.build.outputs.version }}
          path: packages

      - name: Publish release in this repository
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          PACKAGE_VERSION: ${{ needs.build.outputs.version }}
        run: |
          cat > notes.md <<'EOF'
          macOS용 CY뷰어 설치 파일입니다. DMG를 열고 CYViewer.app을 Applications 폴더로 옮겨 주세요.

          이 패키지는 Apple Developer 서명·공증 전 배포본입니다.
          Windows 설치 파일과 아이폰 웹앱은 저장소 README의 다운로드 안내에서 선택할 수 있습니다.
          EOF
          if ! gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "CY뷰어 macOS v${PACKAGE_VERSION}" --notes-file notes.md
          fi
          gh release upload "$RELEASE_TAG" packages/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
