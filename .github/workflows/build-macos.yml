name: macOS build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "macos_app/**"
      - "tests/check_mac_updater.py"
      - "pdfcraft_bridge/**"
      - "scripts/build_pdfcraft.py"
      - "tests/pdfcraft_integration.py"
      - "tests/pdfcraft_macos_smoke.swift"
      - ".github/workflows/build-macos.yml"
  push:
    branches: [main]
    tags: ["macos-v*"]
    paths:
      - "macos_app/**"
      - "tests/check_mac_updater.py"
      - "pdfcraft_bridge/**"
      - "scripts/build_pdfcraft.py"
      - "tests/pdfcraft_integration.py"
      - "tests/pdfcraft_macos_smoke.swift"
      - ".github/workflows/build-macos.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    outputs:
      version: ${{ steps.version.outputs.version }}
    defaults:
      run:
        working-directory: macos_app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: dtolnay/rust-toolchain@1.95.0
      - name: Build PdfCraft page engine
        working-directory: .
        env:
          MACOSX_DEPLOYMENT_TARGET: '10.15'
        run: python3 scripts/build_pdfcraft.py
      - name: Test PdfCraft round trips
        working-directory: .
        run: |
          python3 -m pip install --user --break-system-packages pymupdf
          python3 tests/pdfcraft_integration.py
      - name: Test update release validation
        working-directory: .
        run: python3 tests/check_mac_updater.py
      - name: Resolve packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Read package version
        id: version
        env:
          RELEASE_REF: ${{ github.ref }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^version: \([^+]*\).*/\1/p' pubspec.yaml)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if [[ "$RELEASE_REF" == refs/tags/* && "$RELEASE_TAG" != "macos-v$version" ]]; then
            echo "태그와 pubspec.yaml 버전이 일치하지 않습니다."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build macOS app
        env:
          CY_VIEWER_DESKTOP_CLIENT_SECRET: ${{ secrets.CY_VIEWER_DESKTOP_CLIENT_SECRET }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* && -z "$CY_VIEWER_DESKTOP_CLIENT_SECRET" ]]; then
            echo "데스크톱 OAuth 빌드 설정이 없습니다."
            exit 1
          fi
          flutter build macos --release --dart-define="CY_VIEWER_DESKTOP_CLIENT_SECRET=$CY_VIEWER_DESKTOP_CLIENT_SECRET"

      - name: Embed sandboxed PdfCraft engine
        run: |
          app="build/macos/Build/Products/Release/CYViewer.app"
          cp ../build/pdfcraft/cy-pdfcraft "$app/Contents/MacOS/"
          cp ../build/pdfcraft/THIRD_PARTY_NOTICES.txt "$app/Contents/Resources/"
          codesign --force --sign - --entitlements ../pdfcraft_bridge/macos-helper.entitlements "$app/Contents/MacOS/cy-pdfcraft"
          codesign --force --sign - --entitlements macos/Runner/Release.entitlements "$app"
          codesign --verify --deep --strict "$app"
      - name: Test sandboxed PdfCraft subprocess
        working-directory: .
        run: |
          test_app="build/PdfcraftSmoke.app"
          mkdir -p "$test_app/Contents/MacOS"
          swiftc tests/pdfcraft_macos_smoke.swift -o "$test_app/Contents/MacOS/Run"
          cp build/pdfcraft/cy-pdfcraft "$test_app/Contents/MacOS/"
          cat > "$test_app/Contents/Info.plist" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?><plist version="1.0"><dict><key>CFBundleIdentifier</key><string>com.kimmacaroni.cyviewer.pdfcraft-smoke</string><key>CFBundleExecutable</key><string>Run</string><key>CFBundlePackageType</key><string>APPL</string></dict></plist>
          EOF
          codesign --force --sign - --entitlements pdfcraft_bridge/macos-helper.entitlements "$test_app/Contents/MacOS/cy-pdfcraft"
          codesign --force --sign - --entitlements macos_app/macos/Runner/Release.entitlements "$test_app"
          "$PWD/$test_app/Contents/MacOS/Run"
      - name: Create DMG
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p build/dmg
          cp -R "build/macos/Build/Products/Release/CYViewer.app" build/dmg/
          ln -s /Applications build/dmg/Applications
          hdiutil create -volname "CY뷰어" -srcfolder build/dmg -ov -format UDZO "build/CYViewer-macOS-v${PACKAGE_VERSION}.dmg"
          cd build
          shasum -a 256 "CYViewer-macOS-v${PACKAGE_VERSION}.dmg" > "SHA256SUMS-macOS-v${PACKAGE_VERSION}.txt"

      - name: Upload macOS package
        uses: actions/upload-artifact@v4
        with:
          name: CYViewer-macOS-v${{ steps.version.outputs.version }}
          path: |
            macos_app/build/CYViewer-macOS-v${{ steps.version.outputs.version }}.dmg
            macos_app/build/SHA256SUMS-macOS-v${{ steps.version.outputs.version }}.txt
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/macos-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download macOS package
        uses: actions/download-artifact@v4
        with:
          name: CYViewer-macOS-v${{ needs.build.outputs.version }}
          path: packages

      - name: Publish release in this repository
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          PACKAGE_VERSION: ${{ needs.build.outputs.version }}
        run: |
          cat > notes.md <<'EOF'
          Mac 업데이트는 앱의 안내에서 공식 릴리스 설치 파일을 브라우저로 받아 진행합니다. 앱 안에서 받은 이전 DMG는 사용하지 마세요. DMG를 연 뒤 Applications로 직접 옮겨 교체합니다.

          PdfCraft 기반 PDF 도구를 확장했습니다. 회전·삭제·빈 페이지 삽입, 추출·순서 변경·병합, ZIP 분할, 문서 정보·책갈피 편집과 AES-256 암호 설정·해제를 지원합니다. Mac의 PDF 도구에는 페이지 편집 되돌리기·다시 실행도 포함됩니다. 원본을 유지하면서 선택한 페이지를 새 PDF에 저장하고 다른 PDF를 이어 붙일 수 있습니다.

          macOS용 CY뷰어 설치 파일입니다. DMG를 열고 CYViewer.app을 Applications 폴더로 옮겨 주세요.

          이 패키지는 Apple Developer 서명·공증 전 배포본입니다.
          Windows 설치 파일과 아이폰 웹앱은 저장소 README의 다운로드 안내에서 선택할 수 있습니다.
          EOF
          if ! gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "CY뷰어 macOS v${PACKAGE_VERSION}" --notes-file notes.md
          fi
          gh release upload "$RELEASE_TAG" packages/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
