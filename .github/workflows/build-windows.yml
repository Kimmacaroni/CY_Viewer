name: Windows build
on:
  workflow_dispatch:
  pull_request:
    paths: ['native_windows/**', 'installer/**', 'CYViewer.spec', 'pdfcraft_bridge/**', 'scripts/build_pdfcraft.py', 'tests/pdfcraft_integration.py', '.github/workflows/build-windows.yml']
  push:
    branches: [main]
    tags: ['windows-v*']
    paths: ['native_windows/**', 'installer/**', 'CYViewer.spec', 'pdfcraft_bridge/**', 'scripts/build_pdfcraft.py', 'tests/pdfcraft_integration.py', '.github/workflows/build-windows.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install pyinstaller pymupdf pillow pywin32 tkinterdnd2
      - uses: dtolnay/rust-toolchain@1.95.0
      - name: Build PdfCraft page engine
        run: python scripts/build_pdfcraft.py
      - name: Test PdfCraft round trips
        run: python tests/pdfcraft_integration.py
      - name: Test updater validation
        run: python -m unittest discover -s native_windows/tests -p "test_*.py"
      - name: Smoke test
        run: python native_windows/tests/smoke.py
      - name: Read installer version
        id: version
        env:
          RELEASE_REF: ${{ github.ref }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = [regex]::Match((Get-Content installer/CYViewer.iss -Raw), 'MyAppVersion "([0-9.]+)"').Groups[1].Value
          if (-not $version) { throw '설치 버전이 없습니다.' }
          if ($env:RELEASE_REF.StartsWith('refs/tags/') -and $env:RELEASE_TAG -ne "windows-v$version") { throw '태그와 설치 버전이 다릅니다.' }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Prepare desktop OAuth build configuration
        shell: python
        env:
          CY_VIEWER_DESKTOP_CLIENT_SECRET: ${{ secrets.CY_VIEWER_DESKTOP_CLIENT_SECRET }}
        run: |
          import os
          from pathlib import Path
          value = os.environ.get('CY_VIEWER_DESKTOP_CLIENT_SECRET', '')
          if os.environ['GITHUB_REF'].startswith('refs/tags/') and not value:
              raise SystemExit('데스크톱 OAuth 빌드 설정이 없습니다.')
          Path('native_windows/drive_build_config.py').write_text('CLIENT_SECRET = ' + repr(value) + '\n', encoding='utf-8')
      - name: Build executable and installer
        run: |
          python -m PyInstaller --noconfirm --distpath dist_titleicon4 CYViewer.spec
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer/CYViewer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip freeze > release/build-dependencies.txt
      - name: Test installer
        run: ./native_windows/tests/install_smoke.ps1
      - name: Checksums
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $file = "CYViewer-Setup-v$env:PACKAGE_VERSION.exe"
          $hash = (Get-FileHash "release/$file" -Algorithm SHA256).Hash.ToLower()
          "$hash  $file" | Set-Content "release/SHA256SUMS-Windows-v$env:PACKAGE_VERSION.txt" -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: CYViewer-Windows-v${{ steps.version.outputs.version }}
          path: release/*
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/windows-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: CYViewer-Windows-v${{ needs.build.outputs.version }}
          path: packages
      - name: Publish Windows installer
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          PACKAGE_VERSION: ${{ needs.build.outputs.version }}
        run: |
          cat > notes.md <<'EOF'
          Apple Human Interface Guidelines를 기준으로 문서함·툴바·PDF 편집 화면을 정돈했습니다. 중립 표면, 시스템 글꼴, 밝은·어두운 외형과 대비 강화, 명확한 선택 상태·키보드 저장을 반영했습니다. PDF 도구는 넓은 편집 작업 공간과 고정 저장 영역을 사용하며 작은 화면에서는 전체 화면으로 표시됩니다. 기존 PdfCraft 기능과 제작자·MIT 고지는 유지합니다.
          이전 버전 사용자는 이 설치 파일을 한 번 직접 설치해 주세요.
          Windows 10·11 64비트용 설치 파일입니다. SHA-256과 빌드 의존성 목록을 함께 제공합니다.
          EOF
          gh release create "$RELEASE_TAG" packages/* --verify-tag --title "CY뷰어 Windows v${PACKAGE_VERSION}" --notes-file notes.md --latest=false
