name: 웹앱 빌드 및 배포

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "macos_app/**"
      - "site/**"
      - "pdfcraft_bridge/**"
      - "pdf_workbench/**"
      - "scripts/build_pdf_workbench.py"
      - "scripts/build_pdfcraft*.py"
      - "tests/pdfcraft*"
      - "tests/check_pdf_workbench_korean.py"
      - "tests/package*.json"
      - "tests/downloads.test.cjs"
      - ".github/workflows/deploy-web.yml"
  push:
    branches: [main]
    paths:
      - "macos_app/**"
      - "site/**"
      - "pdfcraft_bridge/**"
      - "pdf_workbench/**"
      - "scripts/build_pdf_workbench.py"
      - "scripts/build_pdfcraft*.py"
      - "tests/pdfcraft*"
      - "tests/check_pdf_workbench_korean.py"
      - "tests/package*.json"
      - "tests/downloads.test.cjs"
      - ".github/workflows/deploy-web.yml"

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: macos_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@1.95.0
      - name: Build browser PdfCraft engine
        working-directory: .
        run: python3 scripts/build_pdfcraft_web.py
      - name: Build complete PdfCraft workbench
        working-directory: .
        run: python3 scripts/build_pdf_workbench.py --web
      - name: Verify complete Korean workbench catalog
        working-directory: .
        run: python3 tests/check_pdf_workbench_korean.py
      - name: Test browser PdfCraft engine
        working-directory: .
        run: |
          npm ci --prefix tests
          python3 -m pip install pymupdf
          node tests/pdfcraft_browser.cjs
          npx --prefix tests playwright install --with-deps webkit
          CY_TEST_BROWSER=webkit node tests/pdfcraft_browser.cjs
      - name: Test download site
        working-directory: .
        run: node --test tests/downloads.test.cjs tests/pdfcraft_bootstrap.test.cjs
      - name: Resolve packages
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Build web app
        env:
          REPOSITORY_NAME: ${{ github.event.repository.name }}
        run: flutter build web --release --target lib/web_main.dart --base-href "/${REPOSITORY_NAME}/"
      - name: Test browser PDF tools workflow
        working-directory: .
        run: |
          node tests/pdfcraft_ui.cjs
          CY_TEST_BROWSER=webkit node tests/pdfcraft_ui.cjs
          node tests/pdfcraft_touch.cjs
          CY_TEST_BROWSER=webkit node tests/pdfcraft_touch.cjs
          node tests/pdfcraft_workbench.cjs
          CY_TEST_BROWSER=webkit node tests/pdfcraft_workbench.cjs
      - name: Include download site
        run: cp -R ../site/download build/web/download
      - uses: actions/upload-pages-artifact@v3
        with:
          path: macos_app/build/web

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
